[package]
name = "multiway"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rust-cli-template"
path = "src/bin/main.rs"

[workspace]
members = ["crates/gateway-crds"]

[dependencies]
async-trait = "0.1.89"
gateway-crds = { path = "crates/gateway-crds" }
bon = "3.8.1"
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive", "env"] }
k8s-openapi.workspace = true
kube.workspace = true
miette = { version = "7.6.0", features = ["fancy"] }
nutype = { version = "0.6.2", features = ["serde"] }
pretty_assertions = "1.4.1"
schemars = "1.2.0"
serde.workspace = true
static_assertions = "1.1.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = { version = "0.1.43", features = ["attributes"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
futures = "0.3"

[workspace.dependencies]
kube = { version = "2.0", default-features = false, features = [
  "runtime",
  "derive",
  "client",
  "rustls-tls",
  "aws-lc-rs",
] }
k8s-openapi = { version = "0.26", features = ["latest", "schemars"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
