# Kind cluster configuration for Gateway API conformance testing
#
# This configuration maps ports 80 and 443 from the host to the control-plane node,
# enabling external access to Gateway data planes using hostPort.
#
# Usage:
#   kind create cluster --name multiway-local --config kind-config.yaml
#
# Note: Multiple Gateways using the same port (e.g., port 80) cannot be run
# simultaneously on a single-node cluster. For full multi-Gateway support,
# consider using MetalLB or a multi-node cluster.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: multiway-local
nodes:
  - role: control-plane
    extraPortMappings:
      # HTTP traffic - maps host port 80 to node port 80
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS traffic - maps host port 443 to node port 443
      - containerPort: 443
        hostPort: 443
        protocol: TCP
