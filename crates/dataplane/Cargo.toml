[package]
name = "multiway-dataplane"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "multiway-dataplane"
path = "src/main.rs"

[dependencies]
# Proxy engine
proxy-core = { path = "../proxy-core" }

# Async runtime (for K8s API client / ConfigMap watcher only)
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Kubernetes client for watching ConfigMap changes via API
# This provides immediate notification of ConfigMap updates, bypassing
# the ~60 second kubelet sync delay for mounted ConfigMaps.
kube.workspace = true
k8s-openapi.workspace = true
futures = "0.3"

# HTTP types
http = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Arc swap for hot-reload
arc-swap = "1.7"
