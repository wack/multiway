name: Build Docker Images

on:
  push:
    branches:
      - trunk
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker-build.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.component }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component:
          - controlplane
          - dataplane
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm64
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)

          # Architecture-specific tag (always set)
          echo "arch_tag=${IMAGE}:${SHA_SHORT}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

          # For non-PR builds, also tag with branch-arch
          # PRs have ref_name like "5/merge" which contains invalid chars for Docker tags
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            # Sanitize branch name: replace / with - for valid Docker tags
            BRANCH=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            echo "branch_tag=${IMAGE}:${BRANCH}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/${{ matrix.component }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.branch_tag && format('{0},{1}', steps.tags.outputs.arch_tag, steps.tags.outputs.branch_tag) || steps.tags.outputs.arch_tag }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
          provenance: false

  # Create multi-arch manifest after all builds complete
  manifest:
    name: Create manifest (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component:
          - controlplane
          - dataplane

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          BRANCH="${{ github.ref_name }}"

          # Create manifest for SHA tag
          docker buildx imagetools create -t "${IMAGE}:${SHA_SHORT}" \
            "${IMAGE}:${SHA_SHORT}-amd64" \
            "${IMAGE}:${SHA_SHORT}-arm64"

          # Create manifest for branch tag
          docker buildx imagetools create -t "${IMAGE}:${BRANCH}" \
            "${IMAGE}:${BRANCH}-amd64" \
            "${IMAGE}:${BRANCH}-arm64"

          # Create 'latest' tag for trunk branch
          if [[ "${BRANCH}" == "trunk" ]]; then
            docker buildx imagetools create -t "${IMAGE}:latest" \
              "${IMAGE}:${SHA_SHORT}-amd64" \
              "${IMAGE}:${SHA_SHORT}-arm64"
          fi
