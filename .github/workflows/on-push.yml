name: "On Push – Validate Build"

on:
  push:
    # Skip running this on the default branch, since the merge queue
    # takes care of validating the commit.
    branches:
      - '**'
      - '!trunk'   # excludes trunk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Detect which files have changed to determine which jobs to run.
  changes:
    name: "Detect Changes"
    runs-on: ubuntu-22.04
    outputs:
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check for shell script changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shell:
              - '**/*.sh'

  # Do not change this job's name without also changing "pr-ready"'s
  # job name in "on-merge.yml". These jobs must have the same name.
  # See the README for more details.
  pr-ready:
    if: always()
    name: "⚡ PR Ready"
    runs-on: ubuntu-22.04
    needs:
    - "build"
    - "shellcheck"
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "One or more dependent jobs failed or was cancelled. All jobs must pass for the PR to be ready."
          exit 1
      - run: echo "OK"
  # This job installs Cargo Make and Cargo Nextest before running
  # the CI workflow using Cargo Make. Most of the time, it should
  # restore Cargo Make and other dependencies from cache.
  build:
    name: Validate Rust Build
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    # We tend to use stable Rust to build MultiWay.
    - name: "Install Rust (Stable)"
      uses: dtolnay/rust-toolchain@stable
      with:
        components: "rustfmt,clippy"
    
    # Restore the cache.
    - name: "Restore Rust Cache"
      uses: "Swatinem/rust-cache@v2"
       
    # Installing from binaries tends to be faster than installing
    # with Cargo from source.
    - name: "Install Cargo Tools from Binaries."
      uses: "taiki-e/install-action@v2"
      with:
        tool: "cargo-make,cargo-nextest,kopium"

    - name: Cache cargo tools
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin
        key: ${{ runner.os }}-cargo-tools-kopium-cargo-make

    - name: Generate Gateway API CRDs
      run: cargo make gen-crds
    # This is the actual "validation" step.
    - name: "Cargo Make"
      run: cargo make ci-flow

  # Run ShellCheck on shell scripts when they change.
  shellcheck:
    name: "ShellCheck"
    runs-on: ubuntu-22.04
    needs: changes
    if: ${{ needs.changes.outputs.shell == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          echo "Running ShellCheck on all shell scripts..."
          find . -type f -name "*.sh" \
            -not -path "./target/*" \
            -not -path "./.git/*" \
            -print0 | xargs -0 shellcheck
          echo "ShellCheck passed!"

