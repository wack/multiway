name: "On Merge | Validate Build"

on:
  # Use a merge queue to gate the creation and storage
  # of these Docker images.
  merge_group:
  # Allow this job to be executed manually from the GH UI.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  pr-ready:
    if: always()
    name: "⚡ PR Ready"
    runs-on: ubuntu-22.04
    needs:
    - "build"
    - "docker"
    - "manifest"
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')  || contains(needs.*.result, 'skipped') }}
        run: |
          echo "One or more dependent jobs failed, was skipped, or was cancelled. All jobs must pass for the PR to be ready."
          exit 1
      - run: echo "OK"

  build:
    name: Validate Rust Build
    runs-on: ubuntu-24.04
    steps:
    - name: "Setup Rust"
      uses: "wack/gh-actions/setup-rust@trunk"

    # We tend to use stable Rust to build MultiWay.
    - name: "Install Rust (Stable)"
      uses: dtolnay/rust-toolchain@stable
      with:
        components: "rustfmt,clippy"
    
    # Restore the cache.
    - name: "Restore Rust Cache"
      uses: "Swatinem/rust-cache@v2"
       
    # Installing from binaries tends to be faster than installing
    # with Cargo from source.
    - name: "Install Cargo Tools from Binaries."
      uses: "taiki-e/install-action@v2"
      with:
        tool: "cargo-make,cargo-nextest,kopium"

    - name: Install kopium
      run: which kopium || cargo install kopium
  
    - name: Cache cargo tools
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin
        key: ${{ matrix.runner }}-cargo-tools-kopium-cargo-make

    - name: Generate Gateway API CRDs
      run: cargo make gen-crds
    # This is the actual "validation" step.
    - name: "Cargo Make"
      run: cargo make ci-flow

  docker:
    name: Build ${{ matrix.component }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs:
      - "build"
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        component:
          - controlplane
          - dataplane
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo tools
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ matrix.runner }}-cargo-tools-kopium-cargo-make

      - name: Install cargo-make and kopium
        run: |
          which cargo-make || cargo install cargo-make
          which kopium || cargo install kopium

      - name: Generate Gateway API CRDs
        run: cargo make gen-crds

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)

          # Architecture-specific tag (always set)
          echo "arch_tag=${IMAGE}:${SHA_SHORT}-${{ matrix.arch }}" >> $GITHUB_OUTPUT

          # For merge queue, use the head SHA for branch tagging
          # Sanitize branch name: replace / with - for valid Docker tags
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            BRANCH=$(echo "${{ github.base_ref }}" | sed 's/\//-/g')
            echo "branch_tag=${IMAGE}:${BRANCH}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BRANCH=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            echo "branch_tag=${IMAGE}:${BRANCH}-${{ matrix.arch }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/${{ matrix.component }}/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.branch_tag && format('{0},{1}', steps.tags.outputs.arch_tag, steps.tags.outputs.branch_tag) || steps.tags.outputs.arch_tag }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
          provenance: false

  # Create multi-arch manifest after all builds complete
  manifest:
    name: Create manifest (${{ matrix.component }})
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component:
          - controlplane
          - dataplane

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.component }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)

          # Create manifest for SHA tag
          docker buildx imagetools create -t "${IMAGE}:${SHA_SHORT}" \
            "${IMAGE}:${SHA_SHORT}-amd64" \
            "${IMAGE}:${SHA_SHORT}-arm64"

          # Create manifest for branch tag
          if [[ "${{ github.event_name }}" == "merge_group" ]]; then
            BRANCH="${{ github.base_ref }}"
            docker buildx imagetools create -t "${IMAGE}:${BRANCH}" \
              "${IMAGE}:${BRANCH}-amd64" \
              "${IMAGE}:${BRANCH}-arm64"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BRANCH="${{ github.ref_name }}"
            docker buildx imagetools create -t "${IMAGE}:${BRANCH}" \
              "${IMAGE}:${BRANCH}-amd64" \
              "${IMAGE}:${BRANCH}-arm64"
          fi

          # Create 'latest' tag for trunk branch
          if [[ "${{ github.base_ref }}" == "trunk" ]] || [[ "${{ github.ref_name }}" == "trunk" ]]; then
            docker buildx imagetools create -t "${IMAGE}:latest" \
              "${IMAGE}:${SHA_SHORT}-amd64" \
              "${IMAGE}:${SHA_SHORT}-arm64"
          fi
