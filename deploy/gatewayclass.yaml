apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: multiway
  labels:
    app.kubernetes.io/name: multiway
spec:
  controllerName: io.multiway/gateway-controller
  description: |
    Multiway is a Gateway API implementation using Pingora as the data plane.
    Each Gateway resource gets its own dedicated proxy deployment.
