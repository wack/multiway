apiVersion: apps/v1
kind: Deployment
metadata:
  name: multiway-controller
  namespace: multiway-system
  labels:
    app.kubernetes.io/name: multiway
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: multiway
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: multiway
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: multiway-controller
      containers:
        - name: controller
          image: multiway-controller:latest
          imagePullPolicy: IfNotPresent
          args:
            - controller
            - --dataplane-image=multiway-dataplane:latest
            - --log-level=info
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
