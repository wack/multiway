apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multiway-controller
  labels:
    app.kubernetes.io/name: multiway
    app.kubernetes.io/component: controller
rules:
  # Gateway API resources
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - referencegrants
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses/status
      - gateways/status
      - httproutes/status
    verbs:
      - get
      - patch
      - update
  # Core resources for data plane provisioning
  - apiGroups:
      - ""
    resources:
      - configmaps
      - services
      - serviceaccounts
      - namespaces
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # RBAC for data plane to read ConfigMaps via API
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Deployments for data plane
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # Events for controller logging
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  # Nodes for determining external addresses (NodePort/hostPort)
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  # Endpoints and EndpointSlices for backend discovery
  - apiGroups:
      - ""
    resources:
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
