apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: multiway-system

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - controller-deployment.yaml
  - gatewayclass.yaml

images:
  - name: multiway-controller
    newName: multiway-controller
    newTag: latest
  - name: multiway-dataplane
    newName: multiway-dataplane
    newTag: latest

labels:
  - pairs:
      app.kubernetes.io/part-of: multiway
    includeSelectors: false
